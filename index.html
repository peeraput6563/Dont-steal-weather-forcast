<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สวนแก่งกะอิ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --ground: #101a14;
    --card: #1a2a21;
    --line: #2c4033;
    --text: #eef2e8;
    --muted: #9fb3a4;
    --dry: #c98f4a;
    --mid: #5b6f61;
    --wet: #4fb6cc;
    --good: #8fd694;
    --warn: #f2c14e;
    --bad: #ff7a59;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    height: 100%;
    padding: 2.5vh 3vw;
    display: flex;
    flex-direction: column;
    gap: 2vh;
    transition: transform 20s linear;
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3vw;
    flex-wrap: wrap;
  }
  h1 { font-size: clamp(26px, min(4vw, 7vh), 64px); font-weight: 800; line-height: 1.1; }
  #clock { font-size: clamp(16px, min(2vw, 3.4vh), 36px); color: var(--muted); }
  .top-stats { display: flex; gap: 3vw; }
  .stat .v { font-size: clamp(32px, min(5vw, 9vh), 90px); font-weight: 800; line-height: 1; }
  .stat .l { font-size: clamp(13px, min(1.4vw, 2.4vh), 24px); color: var(--muted); margin-top: .4vh; }
  .stat.rain.high .v { color: var(--wet); }
  .stat.vpd.ok .v { color: var(--good); }
  .stat.vpd.low .v { color: var(--wet); }
  .stat.vpd.high .v { color: var(--bad); }
  .stat.rg .v { color: var(--wet); }
  #raincheck { font-size: clamp(14px, min(1.8vw, 2.8vh), 30px); color: var(--muted); }
  #raincheck b.miss { color: var(--bad); }
  #raincheck b.false_alarm { color: var(--warn); }
  #raincheck b.match { color: var(--good); }
  #vpdline { font-size: clamp(14px, min(1.8vw, 2.8vh), 30px); color: var(--muted); }
  #vpdline b { color: var(--text); }

  #plots {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 2.5vw;
    grid-template-columns: repeat(var(--cols, 1), 1fr);
  }
  .plot {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 2vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1vh;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .plot .name { font-size: clamp(20px, min(3vw, 5vh), 52px); font-weight: 700; }
  .plot .big { display: flex; align-items: baseline; gap: .6vw; }
  .plot .num { font-size: clamp(48px, min(9vw, 17vh), 200px); font-weight: 800; line-height: .95; }
  .plot .unit { font-size: clamp(22px, min(3.5vw, 6vh), 60px); color: var(--muted); }
  .verdict {
    font-size: clamp(18px, min(2.6vw, 4.4vh), 48px);
    font-weight: 700;
    padding: 1.4vh 1.6vw;
    border-radius: 12px;
    width: fit-content;
    max-width: 100%;
  }
  .skip .verdict, .ok .verdict { background: rgba(143,214,148,.16); color: var(--good); }
  .wait .verdict { background: rgba(242,193,78,.16); color: var(--warn); }
  .water .verdict { background: rgba(255,122,89,.18); color: var(--bad); }
  .unknown .verdict { background: rgba(159,179,164,.16); color: var(--muted); }
  .water { border-color: var(--bad); }

  /* แถบวัดความชื้น: ช่วงแห้ง / กลาง / ชื้นพอ */
  .gauge { position: relative; height: 3.2vh; min-height: 18px; display: flex; border-radius: 99px; overflow: hidden; }
  .gauge i { display: block; height: 100%; }
  .gauge .dry { background: var(--dry); }
  .gauge .mid { background: var(--mid); }
  .gauge .wet { background: var(--wet); }
  .mark {
    position: absolute; top: -35%; bottom: -35%; width: 6px;
    background: var(--text); border-radius: 3px; transform: translateX(-50%);
    box-shadow: 0 0 0 3px var(--card);
  }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: clamp(14px, 1.5vw, 24px); margin-top: .8vh; }

  footer { color: var(--muted); font-size: clamp(14px, 1.4vw, 22px); display: flex; justify-content: space-between; gap: 2vw; }
  #stale { color: var(--bad); font-weight: 700; }

  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.05fr 1fr; gap: 2.5vw; }
  #left { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 1.5vh; min-height: 0; min-width: 0; }
  #mapbox { position: relative; min-height: 0; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); background: var(--card); }
  #map { position: absolute; inset: 0; background: #0d1511; }
  #maplabel {
    position: absolute; left: 12px; bottom: 28px; z-index: 1000;
    background: rgba(16,26,20,.82); border-radius: 10px; padding: .8vh 1vw;
    font-size: clamp(14px, 1.6vw, 28px); line-height: 1.35; pointer-events: none;
  }
  #maplabel .t { font-weight: 700; color: var(--text); }
  #maplabel .s { color: var(--muted); font-size: .8em; }
  #maplabel a { color: var(--muted); }
  .leaflet-container { font-family: inherit; }
  .basemap { filter: invert(1) hue-rotate(180deg) saturate(.45) brightness(.78) contrast(.9); }
  @media (max-width: 900px) {
    #main { grid-template-columns: 1fr; }
    #mapbox { min-height: 45vh; }
    #stage { overflow-y: auto; }
    body { overflow: auto; }
    #plots { grid-template-columns: 1fr !important; }
  }
  @media (prefers-reduced-motion: reduce) { #stage { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div>
      <h1 id="garden">สวนแก่งกะอิ</h1>
      <div id="clock"></div>
    </div>
    <div class="top-stats">
      <div class="stat"><div class="v" id="temp">--</div><div class="l">อุณหภูมิ</div></div>
      <div class="stat vpd" id="vpdbox"><div class="v" id="vpd">--</div><div class="l">VPD (kPa)</div></div>
      <div class="stat rg" id="gaugebox" hidden><div class="v" id="gauge">--</div><div class="l" id="gaugel">ฝนที่วัดได้ (มม.)</div></div>
      <div class="stat rain" id="rainbox"><div class="v" id="rain">--</div><div class="l">โอกาสฝนวันนี้</div></div>
    </div>
  </header>

  <div id="main">
    <div id="left">
      <section id="plots"></section>
      <div id="raincheck"></div>
      <div id="vpdline"></div>
    </div>
    <section id="mapbox">
      <div id="map"></div>
      <div id="maplabel"><div class="t">เรดาร์ฝน กำลังโหลด...</div></div>
    </section>
  </div>

  <footer>
    <span id="updated">กำลังโหลด...</span>
    <span id="stale"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => (v === null || v === undefined) ? "--" : Number(v).toFixed(d);

function tick() {
  $("#clock").textContent = new Date().toLocaleString("th-TH", {
    timeZone: "Asia/Bangkok", weekday: "long", day: "numeric", month: "long",
    hour: "2-digit", minute: "2-digit"
  });
}

function plotHTML(p) {
  const a = p.water_below, b = p.skip_above - p.water_below, c = 100 - p.skip_above;
  const pos = p.soil === null ? null : Math.max(0, Math.min(100, p.soil));
  return `
  <article class="plot ${p.status}">
    <div class="name">${p.name}</div>
    <div class="big"><span class="num">${fmt(p.soil)}</span><span class="unit">%</span></div>
    <div>
      <div class="gauge">
        <i class="dry" style="width:${a}%"></i><i class="mid" style="width:${b}%"></i><i class="wet" style="width:${c}%"></i>
        ${pos === null ? "" : `<span class="mark" style="left:${pos}%"></span>`}
      </div>
      <div class="scale"><span>แห้ง &lt; ${p.water_below}%</span><span>ชื้นพอ &gt; ${p.skip_above}%</span></div>
    </div>
    <div class="verdict">${p.text}</div>
  </article>`;
}

function render(d) {
  $("#garden").textContent = d.garden_name;
  document.title = d.garden_name;
  $("#temp").textContent = d.temp === null ? "--" : fmt(d.temp, 1) + "°";
  $("#rain").textContent = d.rain === null ? "--" : fmt(d.rain) + "%";
  $("#rainbox").classList.toggle("high", d.rain !== null && d.rain >= d.rain_threshold);
  const g = d.rain_gauge;
  $("#gaugebox").hidden = !g;
  if (g) {
    $("#gauge").textContent = fmt(g.daily, 1);
    $("#gaugel").textContent = "ฝนวันนี้ (มม.)" + (g.hour_mm ? ` · ชม.นี้ ${fmt(g.hour_mm, 1)}` : "");
  }
  const note = d.state && d.state.last_note;
  const fresh = note && (Date.now() - new Date(note.time).getTime()) < 6 * 3600 * 1000;
  const label = { miss: "โมเดลพลาด", false_alarm: "โมเดลบอกฝนแต่ไม่ตก", match: "ตรงกับโมเดล", info: "" };
  $("#raincheck").innerHTML = fresh
    ? `ฝนจริงเทียบโมเดล: <b class="${note.kind}">${label[note.kind] || ""}</b> ${note.kind === "false_alarm" ? note.text.replace("☀️ ", "") : note.text}`
    : "";
  $("#vpd").textContent = d.vpd === null || d.vpd === undefined ? "--" : fmt(d.vpd, 2);
  $("#vpdbox").className = "stat vpd " + (d.vpd_status || "");
  if (d.vpd_range) {
    $("#vpdline").innerHTML = `ระยะ<b>${d.vpd_stage}</b> เหมาะสม ${d.vpd_range[0]}–${d.vpd_range[1]} kPa · <b>${d.vpd_text || ""}</b>` +
      (d.vpd_match && d.vpd_match.length ? `<br>ตอนนี้เข้าเกณฑ์ของระยะ: ${d.vpd_match.join(", ")}` : "") +
      (d.th_source === "indoor" ? `<br>(อุณหภูมิ/ความชื้นจากตัว gateway ในอาคาร)` : "");
  } else { $("#vpdline").textContent = ""; }
  $("#plots").style.setProperty("--cols", Math.min(d.plots.length, 2));
  $("#plots").innerHTML = d.plots.map(plotHTML).join("");

  const t = new Date(d.updated_at);
  $("#updated").textContent = "อัปเดตล่าสุด " + t.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  const ageMin = (Date.now() - t.getTime()) / 60000;
  $("#stale").textContent = ageMin > 30 ? "ข้อมูลเก่ากว่า 30 นาที ตรวจสอบระบบ" : "";
}

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    $("#stale").textContent = "โหลดข้อมูลไม่ได้";
  }
}

// ขยับภาพเล็กน้อยทุก 2 นาที กันภาพติดจอ
const shifts = [[0,0],[6,4],[-6,8],[4,-6],[-4,-4]];
let si = 0;
setInterval(() => {
  si = (si + 1) % shifts.length;
  $("#stage").style.transform = `translate(${shifts[si][0]}px, ${shifts[si][1]}px)`;
}, 120000);

// ---------- แผนที่เรดาร์ฝน (RainViewer) ----------
let map = null, radar = [], frames = [], frameIdx = 0, animTimer = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });

function setLabel(main, sub) {
  $("#maplabel").innerHTML = `<div class="t">${main}</div>` + (sub ? `<div class="s">${sub}</div>` : "") +
    `<div class="s">เรดาร์โดย <a href="https://www.rainviewer.com/">RainViewer</a></div>`;
}

function showFrame(i) {
  frameIdx = i;
  radar.forEach((l, k) => l.setOpacity(k === i ? 0.75 : 0));
  const last = frames.length - 1;
  const ageMin = Math.max(0, Math.round((Date.now() / 1000 - frames[last].time) / 60));
  setLabel(
    (i === last ? "เรดาร์ล่าสุด " : "ย้อนหลัง ") + hhmm(frames[i].time),
    `ข้อมูลล่าสุดเมื่อ ${ageMin} นาทีที่แล้ว · วนย้อนหลัง 2 ชม.`
  );
}

function animate() {
  clearTimeout(animTimer);
  if (!frames.length) return;
  const next = (frameIdx + 1) % frames.length;
  showFrame(next);
  animTimer = setTimeout(animate, next === frames.length - 1 ? 3000 : 700);
}

async function loadRadar() {
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
    const j = await r.json();
    const past = (j.radar && j.radar.past) || [];
    if (!past.length) throw new Error("no frames");
    clearTimeout(animTimer);
    radar.forEach(l => map.removeLayer(l));
    frames = past;
    radar = past.map(f => L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, {
      opacity: 0, maxNativeZoom: 7, maxZoom: 9, zIndex: 5
    }).addTo(map));
    showFrame(frames.length - 1);
    if (!reduceMotion) animTimer = setTimeout(animate, 3000);
  } catch (e) {
    setLabel("โหลดเรดาร์ไม่ได้", "จะลองใหม่อีกครั้งใน 5 นาที");
  }
}

async function initMap() {
  try {
    const cfg = await (await fetch("config.json?t=" + Date.now())).json();
    const c = [cfg.latitude, cfg.longitude];
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView(c, 7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 9, className: "basemap", attribution: "© OpenStreetMap"
    }).addTo(map);
    [50, 100].forEach(km => L.circle(c, { radius: km * 1000, color: "#eef2e8", weight: 1, opacity: .45, dashArray: "4 6", fill: false, interactive: false }).addTo(map));
    L.circleMarker(c, { radius: 9, color: "#fff", weight: 3, fillColor: "#ff7a59", fillOpacity: 1 }).addTo(map);
    new ResizeObserver(() => map.invalidateSize()).observe($("#mapbox"));
    loadRadar();
    setInterval(loadRadar, 5 * 60 * 1000);
  } catch (e) {
    setLabel("เปิดแผนที่ไม่ได้", "");
  }
}

tick(); setInterval(tick, 15000);
initMap();
load(); setInterval(load, 60000);
</script>
</body>
</html>
